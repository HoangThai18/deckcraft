[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/slidecraft", "apps/slidecraft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/slidecraft"

[workspace.dependencies]
# internal
slidecraft-geom = { path = "crates/geom" }
slidecraft-color = { path = "crates/color" }
slidecraft-model = { path = "crates/model" }
slidecraft-fonts = { path = "crates/fonts" }
slidecraft-text = { path = "crates/text" }
slidecraft-render = { path = "crates/render" }
slidecraft-pdf = { path = "crates/pdf" }
slidecraft-pptx = { path = "crates/pptx" }
slidecraft-format = { path = "crates/format" }
slidecraft-anim = { path = "crates/anim" }
slidecraft-engine = { path = "crates/engine" }
slidecraft-mcp = { path = "crates/mcp" }
slidecraft-ui-egui = { path = "crates/ui-egui" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
krilla = { version = "0.8", features = ["pdf"] }
i_overlay = "9"
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
