[package]
name = "slidecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SlideCraft desktop app"
publish = false
default-run = "slidecraft"

[lints]
workspace = true

[dependencies]
slidecraft-engine = { workspace = true }
slidecraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for slidecraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
