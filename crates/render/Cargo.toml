[package]
name = "slidecraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SlideCraft renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
slidecraft-geom = { workspace = true }
slidecraft-color = { workspace = true }
slidecraft-model = { workspace = true }
slidecraft-fonts = { workspace = true }
slidecraft-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
